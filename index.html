<style>
:root{--font-quran:'Amiri Quran','Amiri','Scheherazade New',serif;--font-ui:'Cairo',system-ui,sans-serif}
body{font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}




  :root {
    --font-quran: 'Amiri Quran', 'Amiri', 'Scheherazade New', serif;
    --font-ui: 'Cairo', system-ui, -apple-system, sans-serif;
  }

  body {
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }

.font-quran {
  font-family: 'Amiri Quran', 'Amiri', 'Scheherazade New', serif;
  line-height: 2.5;
  letter-spacing: 0.015em;
  word-spacing: 0.15em;
  font-weight: 500;
  text-rendering: optimizeLegibility;
}

.font-amiri {
  font-family: 'Amiri', serif;
}

.font-cairo {
  font-family: 'Cairo', system-ui, sans-serif;
}

/* Moroccan Arch / Islamic Frame Decorations */
.moroccan-pattern {
  background-color: #064e3b;
  background-image: radial-gradient(#d97706 0.75px, transparent 0.75px), radial-gradient(#059669 0.75px, #064e3b 0.75px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
}

.moroccan-pattern-light {
  background-color: #fbf8f2;
  background-image: radial-gradient(#d97706 0.6px, transparent 0.6px), radial-gradient(#e2e8f0 0.6px, #fbf8f2 0.6px);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}

/* Islamic Ayah End Marker */
.ayah-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.85em;
  height: 1.85em;
  margin: 0 0.25rem;
  border-radius: 9999px;
  border: 1px solid #d97706;
  background: radial-gradient(circle, #fef3c7 0%, #fde68a 100%);
  color: #78350f;
  font-size: 0.75em;
  font-weight: 700;
  vertical-align: middle;
}

.dark .ayah-badge {
  border-color: #b45309;
  background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
  color: #fbbf24;
}

/* Smooth custom scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.05);
}
::-webkit-scrollbar-thumb {
  background: rgba(6, 78, 59, 0.3);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(6, 78, 59, 0.6);
}


</style>
